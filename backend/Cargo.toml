[package]
name = "dashboard-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.13.0"
actix-cors = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.39.0", features = ["bundled"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
hmac = "0.12.1"
sha2 = "=0.10.8"
rand = "=0.8.5"
base64 = "0.22.1"
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
tokio = { version = "1.50.0", features = ["full"] }
env_logger = "0.11.10"
log = "0.4.29"
